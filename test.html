<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crepe Editor with Raw Markdown</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        #app {
            flex: 1;
            min-height: 500px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
        }
        #raw-markdown {
            flex: 1;
            min-height: 500px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            background-color: #f5f5f5;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app"></div>
        <pre id="raw-markdown"></pre>
    </div>

    <script type="module">
        import { Crepe } from '@milkdown/crepe';
        import "@milkdown/crepe/theme/common/style.css";
        import "@milkdown/crepe/theme/frame.css";

        const defaultValue = `# Welcome to Crepe Editor

This is a simple example of markdown syntax.

## Features

- **Bold text**
- *Italic text*
- ~~Strikethrough~~
- \`Inline code\`

### Code Block

\`\`\`javascript
console.log('Hello, World!');
\`\`\`

> Blockquote example

1. Ordered list
2. With multiple items

- [ ] Todo item
- [x] Completed item

[Link example](https://example.com)`;

        const crepe = new Crepe({
            root: document.getElementById('app'),
            defaultValue,
        });

        // Function to update raw markdown display
        function updateRawMarkdown() {
            const markdown = crepe.getMarkdown();
            document.getElementById('raw-markdown').textContent = markdown;
        }

        // Create editor and set up listeners
        crepe.create().then(() => {
            console.log('Editor created');
            updateRawMarkdown(); // Initial update
            
            // Listen for markdown updates
            crepe.on((listener) => {
                listener.markdownUpdated(() => {
                    updateRawMarkdown();
                });
            });
        });

        // Clean up on page unload
        window.addEventListener('unload', () => {
            crepe.destroy();
        });
    </script>
</body>
</html>
